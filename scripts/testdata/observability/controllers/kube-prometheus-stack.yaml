# CI SELF-TEST FIXTURE ONLY. Not deployed and not the monitoring configuration.
# Used by scripts/validate-observability.sh while clusters/home/monitoring does
# not exist, to prove that HelmRelease values are extracted, rendered with the
# pinned chart and validated. The real source of truth is the Flux HelmRelease
# under clusters/home/monitoring/controllers/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Every image enabled in this configuration is pinned explicitly; see
    # scripts/observability-image-pins.yaml.
    prometheusOperator:
      image:
        registry: quay.io
        repository: prometheus-operator/prometheus-operator
        tag: v0.94.1
      prometheusConfigReloader:
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-config-reloader
          tag: v0.94.1
      admissionWebhooks:
        patch:
          image:
            registry: ghcr.io
            repository: jkroepke/kube-webhook-certgen
            tag: 1.8.9
    prometheus:
      prometheusSpec:
        image:
          registry: quay.io
          repository: prometheus/prometheus
          tag: v3.15.0-distroless
    alertmanager:
      alertmanagerSpec:
        image:
          registry: quay.io
          repository: prometheus/alertmanager
          tag: v0.34.1
    kube-state-metrics:
      image:
        registry: registry.k8s.io
        repository: kube-state-metrics/kube-state-metrics
        tag: v2.20.0
    prometheus-node-exporter:
      image:
        registry: quay.io
        repository: prometheus/node-exporter
        tag: v1.12.1
    grafana:
      enabled: false
