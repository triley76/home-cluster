# CI SELF-TEST FIXTURE ONLY. Mirrors the Pod Security labels of the real namespaces in
# clusters/home/monitoring/controllers/namespace.yaml, so the Pod Security check sees the
# same enforce levels as in repository mode.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-node-exporter
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
