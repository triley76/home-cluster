extends: default

ignore: |
  # Generated by `flux bootstrap`; regenerated rather than hand-edited.
  clusters/home/flux-system/gotk-components.yaml

rules:
  document-start: disable
  indentation:
    # Flux-generated files use unindented sequences; accept either style per file.
    indent-sequences: consistent
  line-length:
    max: 160
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
