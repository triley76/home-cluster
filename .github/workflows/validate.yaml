name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Static checks only. Passing results do not demonstrate apply ordering,
# Flux dependency behavior, or clean-bootstrap success on a live cluster.
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/install-gitleaks.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  lint:
    name: YAML lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install --disable-pip-version-check yamllint==1.38.0

      - name: Lint
        run: yamllint --strict .

  manifests:
    name: Render and schema-validate
    runs-on: ubuntu-24.04
    env:
      KUSTOMIZE_VERSION: 5.8.1
      KUBECONFORM_VERSION: 0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/install-kustomize.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Install kubeconform
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/install-kubeconform.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          archive="kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/CHECKSUMS"
          grep " ${archive}\$" CHECKSUMS | sha256sum -c -
          tar -xzf "${archive}" kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render and validate
        run: bash scripts/validate-manifests.sh

  observability:
    name: Observability render and rules
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: 0.8.0
      # Helm CLI used to render the pinned chart locally.
      HELM_VERSION: 4.2.4
      # promtool from the same Prometheus release as the pinned chart's Prometheus image.
      PROMETHEUS_VERSION: 3.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install --disable-pip-version-check --require-hashes -r scripts/requirements-observability.txt

      - name: Install kubeconform
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/install-kubeconform.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          archive="kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/CHECKSUMS"
          grep " ${archive}\$" CHECKSUMS | sha256sum -c -
          tar -xzf "${archive}" kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Install helm
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/install-helm.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/${archive}"
          curl -fsSLO "https://get.helm.sh/${archive}.sha256sum"
          sha256sum -c "${archive}.sha256sum"
          tar -xzf "${archive}" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm

      - name: Install promtool
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/install-promtool.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/sha256sums.txt"
          grep " ${archive}\$" sha256sums.txt | sha256sum -c -
          tar -xzf "${archive}" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install -m 0755 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

      - name: Validate observability configuration
        run: bash scripts/validate-observability.sh

      - name: Test the observability validator
        run: bash scripts/test-validate-observability.sh
